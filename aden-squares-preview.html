const COLORS={'المنصورة':'#1a5fb4','الشيخ عثمان':'#e66100','البريقة':'#26a269','كريتر':'#a51d2d','المعلا':'#813d9c','خورمكسر':'#986a44'};
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
const map=L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layers={};const list=document.getElementById('list');
const style=(c,on)=>({color:c,weight:on?4:2,fillColor:c,fillOpacity:on?.5:.25});
function select(n){
  Object.entries(layers).forEach(([k,l])=>l.setStyle(style(COLORS[l.district],+k===n)));
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',+e.dataset.n===n));
  map.fitBounds(layers[n].getBounds(),{padding:[40,40],maxZoom:16});
  layers[n].openPopup();
}
let lastSector=null;
DATA.features.forEach(f=>{
  const p=f.properties,c=COLORS[p.district]||'#333';
  if(p.sector!==lastSector){lastSector=p.sector;const g=document.createElement('div');g.className='grp';g.style.background=c;g.textContent=p.sector;list.appendChild(g)}
  const poly=L.geoJSON(f,{style:style(c,false)}).addTo(map).getLayers()[0];
  poly.district=p.district;layers[p.number]=poly;
  poly.bindPopup('<div class="pop"><h3>'+esc(p.name)+' — '+esc(p.district)+'</h3><b>الفرع المسؤول: '+esc(p.branch)+'</b><dl>'
    +'<dt>الموقع</dt><dd>'+esc(p.location)+'</dd><dt>النشاط</dt><dd>'+esc(p.activity)+'</dd>'

  poly.on('click',()=>select(p.number));
  L.marker([p.centerLat,p.centerLng],{interactive:false,icon:L.divIcon({className:'',html:'<div class="lbl" style="border-color:'+c+';color:'+c+'">'+p.number+'</div>',iconSize:[0,0]})}).addTo(map);
  const it=document.createElement('div');it.className='item';it.dataset.n=p.number;
  it.innerHTML='<b>'+esc(p.name)+'</b> · '+esc(p.branch)+'<small>'+esc(p.location)+'</small>';
